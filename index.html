    <link rel="apple-touch-icon" href="/logo-square.png" />
    <meta property="og:image" content="/logo-square.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Freedom By Mentico</title>
    <meta name="description" content="Stop overthinking people. Start talking to them. A comprehensive field guide and 30-day challenge for introverts and overthinkers. Download Social Freedom from ₹299." />
    <!-- Consistent, readable typography across landing and checkout -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://api.razorpay.com">
    <link rel="preconnect" href="https://checkout.razorpay.com">
    <!-- Meta Pixel -->
    <script>
      (function (window, document) {
        if (window.fbq) return;

        const pixel = window.fbq = function () {
          if (pixel.callMethod) {
            pixel.callMethod.apply(pixel, arguments);
          } else {
            pixel.queue.push(arguments);
          }
        };
        if (!window._fbq) window._fbq = pixel;
        pixel.push = pixel;
        pixel.loaded = true;
        pixel.version = '2.0';
        pixel.queue = [];

        const script = document.createElement('script');
        script.async = true;
        script.src = 'https://connect.facebook.net/en_US/fbevents.js';
        document.head.appendChild(script);
      })(window, document);
      window.fbq('init', '1339509294966597');
      window.fbq('track', 'PageView');
    </script>
  </head>
  <body>
    <noscript>
      <img width="1" height="1" style="display:none" alt=""
        src="https://www.facebook.com/tr?id=1339509294966597&amp;ev=PageView&amp;noscript=1" />
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
